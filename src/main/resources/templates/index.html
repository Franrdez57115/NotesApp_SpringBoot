<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Mis Notas</title>

    <!--Links de Fuentes y Tailwind -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>

    <!-- Scripts -->
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#8685EF",
                        "primary-hover": "#6c6ae9",
                        "accent": "#F0B9A8",
                        "background": "#F9F9FB",
                        "card": "#FFFFFF",
                        "text-primary": "#2D3748",
                        "text-secondary": "#718096",
                        "icon": "#A0AEC0",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "0.75rem",
                        "xl": "1rem",
                        "full": "9999px"
                    },
                    boxShadow: {
                        'soft': '0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03)',
                        'lifted': '0 10px 15px -3px rgba(0, 0, 0, 0.07), 0 4px 6px -2px rgba(0, 0, 0, 0.05)'
                    }
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            font-size: 20px;
        }
    </style>
</head>
<body class="font-display bg-background text-text-primary">
<div class="relative flex min-h-screen w-full flex-col" sec:authorize="isAuthenticated()">
    <div class="layout-container flex h-full grow flex-col">
        <div class="px-4 sm:px-10 md:px-20 lg:px-40 flex flex-1 justify-center py-5">
            <div class="layout-content-container flex flex-col w-full max-w-[960px] flex-1">

                <header class="flex items-center justify-between whitespace-nowrap py-5 mb-4">
                    <div class="flex items-center gap-4">
                        <h1 class="text-text-primary text-2xl font-bold">Hola, <span class="text-primary" sec:authentication="name"></span>
                        </h1>
                    </div>
                    <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit"
                                class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-4 bg-transparent text-text-secondary border border-gray-200 hover:bg-gray-100 text-sm font-bold leading-normal tracking-[0.015em] transition-colors">
                            <span class="truncate text-red-500">Cerrar Sesión</span>
                        </button>
                    </form>
                </header>

                <div class="flex items-center justify-between px-4 pb-3 pt-5">
                    <h2 class="text-text-primary text-[22px] font-bold leading-tight tracking-[-0.015em]">Mis Notas</h2>
                    <button id="addNoteBtn"
                            class="flex items-center gap-2 min-w-[84px] max-w-[480px] cursor-pointer justify-center overflow-hidden rounded-full h-12 px-6 bg-primary text-white text-base font-bold leading-normal tracking-[0.015em] shadow-lg shadow-primary/30 hover:bg-primary-hover transition-colors">
                        <span class="material-symbols-outlined">add</span>
                        <span class="truncate">Crear Nueva Nota</span>
                    </button>
                </div>


                <!-- Listado de Notas -->
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 pt-4">
                    <div class="flex h-full flex-col items-stretch justify-start rounded-xl shadow-soft bg-card overflow-hidden"
                         th:each="note : ${notes}" th:id="'note-' + ${note.id}">
                        <div class="flex w-full grow flex-col items-stretch justify-between p-5 gap-4" th:style="'background-color:' + ${note.color}">
                            <div>
                                <h3 class="text-text-primary text-lg font-bold leading-tight"
                                    th:text="${note.title}"></h3>
                                <p class="text-text-secondary text-sm font-normal leading-normal mt-2 line-clamp-3"
                                   th:text="${note.description}"></p>
                            </div>
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <div class="flex items-center justify-end gap-1 mt-4">
                                <a aria-label="Ver nota"
                                   th:href="@{/notes/view/{id}(id=${note.id})}"
                                   class="flex items-center justify-center p-2 rounded-full hover:bg-gray-100 text-icon transition-colors">
                                    <span class="material-symbols-outlined">visibility</span>
                                </a>

                                <button aria-label="Editar nota"
                                        class="flex items-center justify-center p-2 rounded-full hover:bg-gray-100 text-icon"
                                        th:data-id="${note.id}"
                                        th:data-title="${note.title}"
                                        th:data-description="${note.description}"
                                        th:data-autor="${note.autor}"
                                        th:data-state="${note.state}"
                                        th:data-color="${note.color}"
                                        onclick="openEditModal(this)">
                                    <span class="material-symbols-outlined">edit</span>
                                </button>
                                <button aria-label="Eliminar nota"
                                        class="flex items-center justify-center p-2 rounded-full hover:bg-gray-100 text-icon"
                                        th:attr="onclick=|deleteNote(${note.id})|">
                                    <span class="material-symbols-outlined">delete</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Formulario Modal para Añadir/Editar Nota -->
                <div id="noteModal" class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50">
                    <div class="bg-white rounded-xl shadow-lg p-6 w-full max-w-md relative">
                        <button id="closeModalBtn" class="absolute top-3 right-3 text-gray-500 hover:text-gray-700">
                            <span class="material-symbols-outlined">close</span>
                        </button>

                        <h2 id="modalTitle" class="text-xl font-bold mb-4">Nueva Nota</h2>

                        <input type="hidden" id="noteId">

                        <div class="mb-3">
                            <label class="block text-sm font-medium text-gray-700">Título</label>
                            <input id="noteTitle" type="text" maxlength="50"
                                   class="w-full mt-1 border border-gray-300 rounded-lg p-2 focus:ring-indigo-500 focus:border-indigo-500">
                        </div>

                        <div class="mb-3">
                            <label class="block text-sm font-medium text-gray-700">Descripción</label>
                            <textarea id="noteDescription"
                                      class="w-full mt-1 border border-gray-300 rounded-lg p-2 focus:ring-indigo-500 focus:border-indigo-500"
                                      rows="3"
                                      maxlength="150"></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="block text-sm font-medium text-gray-700">Autor</label>
                            <input id="noteAutor" type="text" maxlength="20"
                                   class="w-full mt-1 border border-gray-300 rounded-lg p-2 focus:ring-indigo-500 focus:border-indigo-500">
                        </div>

                        <div class="mb-3">
                            <label class="block text-sm font-medium text-gray-700">Estado</label>
                            <select id="noteState" class="w-full mt-1 border border-gray-300 rounded-lg p-2">
                                <option value="CREADA">Creada</option>
                                <option value="EN_PROCESO">En Proceso</option>
                                <option value="HECHA">Hecha</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="block text-sm font-medium text-gray-700">Color</label>
                            <input id="noteColor" type="color"
                                   class="w-full mt-1 h-10 rounded-lg cursor-pointer border">
                        </div>

                        <div class="flex justify-end gap-2 mt-4">
                            <button id="cancelBtn" class="px-4 py-2 rounded-lg bg-gray-200 hover:bg-gray-300">Cancelar
                            </button>
                            <button id="saveNoteBtn"
                                    class="px-4 py-2 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700">Guardar
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<div id="deleteModal"
     class="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center hidden z-50">
    <div class="bg-white dark:bg-background-dark rounded-lg shadow-lg w-80 p-6 text-center">
        <h3 class="text-lg font-semibold text-gray-800 dark:text-gray-100 mb-4">
            ¿Deseas eliminar esta nota?
        </h3>
        <div class="flex justify-center gap-4">
            <button id="cancelDelete"
                    class="px-4 py-2 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-100 dark:text-gray-200 dark:border-gray-600 dark:hover:bg-gray-700 transition">
                Cancelar
            </button>
            <button id="confirmDelete"
                    class="px-4 py-2 rounded-lg bg-red-600 text-white hover:bg-red-700 transition">
                Eliminar
            </button>
        </div>
    </div>
</div>


<script th:src="@{/js/notes.js}"></script>
</body>
</html>
