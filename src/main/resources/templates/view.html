<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${note.title}"></title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/view.css" type="text/css">
</head>
<body>

<div class="note-container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="text-secondary"><i class="bi bi-journal-text"></i>Nota</h5>
        <a th:href="@{/notes}" class="btn-back" style="color: rgb(134 133 239)">← Volver</a>
    </div>

    <h2 class="note-title" th:text="${note.title}"></h2>

    <p class="note-content" th:text="${note.description}">

    </p>

    <div class="note-meta">
        <div><strong>Autor</strong><br><span th:text="${note.autor}"></span></div>
        <div><strong>Fecha Creacion</strong><br><span
                th:text="${note.date}"></span></div>
        <div><strong>Estado</strong><br><span th:text="${note.state}"></span></div>
    </div>
</div>

</body>
</html>
