<!DOCTYPE html>
<html class="light" lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Registro</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#8685ef",
                        "background-light": "#f8f9fa",
                        "background-dark": "#121121",
                        "text-light": "#212529",
                        "text-dark": "#f8f9fa",
                        "text-muted-light": "#646487",
                        "text-muted-dark": "#a0a0b0",
                        "border-light": "#dcdce5",
                        "border-dark": "#33334a",
                        "input-bg-light": "#ffffff",
                        "input-bg-dark": "#1a192c",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "0.75rem",
                        "xl": "1rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24
        }
    </style>
</head>
<body class="font-display bg-background-light dark:bg-background-dark text-text-light dark:text-text-dark">
<div class="relative flex min-h-screen w-full flex-col items-center justify-center group/design-root overflow-x-hidden p-4">
    <div th:if="${error}" th:text="${error}"></div>
    <div class="flex w-full max-w-md flex-col items-center rounded-xl bg-white dark:bg-background-dark dark:border dark:border-border-dark p-8 shadow-sm">
        <div class="w-full">
            <div class="mb-6 text-center">
                <p class="text-3xl font-black tracking-tighter text-text-light dark:text-text-dark">Crear una Cuenta</p>
            </div>
            <form class="flex w-full flex-col gap-4" th:action="@{/register}" method="post" th:object="${userDto}">
                <div class="w-full">
                    <label class="flex flex-col">
                        <p class="pb-2 text-sm font-medium text-text-light dark:text-text-dark">Usuario</p>
                        <input class="form-input h-12 w-full resize-none overflow-hidden rounded-lg border border-border-light bg-input-bg-light p-3 text-base font-normal text-text-light placeholder:text-text-muted-light focus:border-primary focus:outline-0 focus:ring-2 focus:ring-primary/20 dark:border-border-dark dark:bg-input-bg-dark dark:text-text-dark dark:placeholder:text-text-muted-dark dark:focus:border-primary"
                               placeholder="Ingresa tu usuario" th:name="username"/>
                    </label>
                </div>
                <div class="w-full">
                    <label class="flex flex-col">
                        <p class="pb-2 text-sm font-medium text-text-light dark:text-text-dark">Contraseña</p>
                        <div class="flex w-full items-stretch rounded-lg">
                            <input class="form-input h-12 w-full resize-none overflow-hidden rounded-lg border border-border-light bg-input-bg-light p-3 text-base font-normal text-text-light placeholder:text-text-muted-light focus:border-primary focus:outline-0 focus:ring-2 focus:ring-primary/20 dark:border-border-dark dark:bg-input-bg-dark dark:text-text-dark dark:placeholder:text-text-muted-dark dark:focus:border-primary"
                                   placeholder="Ingresa tu contraseña" type="password" th:name="password"/>
                        </div>
                    </label>
                </div>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <div class="w-full pt-4">
                    <button class="flex h-12 w-full cursor-pointer items-center justify-center overflow-hidden rounded-lg bg-primary text-white text-base font-bold leading-normal tracking-wide transition-colors hover:bg-primary/90">
                        <span class="truncate">Registrarse</span>
                    </button>
                </div>
                <div class="w-full pt-2 text-center">
                    <p class="text-sm font-normal text-text-muted-light dark:text-text-muted-dark">¿Ya tienes una
                        cuenta? <a class="font-medium text-primary underline hover:text-primary/90" th:href="@{/login}">Iniciar
                            Sesión</a></p>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
