<!DOCTYPE html>
<html class="light" lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Iniciar Sesión</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#8685ef",
                        "background-light": "#f4f5f7",
                        "background-dark": "#121121",
                        "text-light": "#212529",
                        "text-dark": "#f8f9fa",
                        "text-secondary-light": "#6c757d",
                        "text-secondary-dark": "#adb5bd",
                        "border-light": "#dcdce5",
                        "border-dark": "#343a40",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-text-light dark:text-text-dark">
<div class="flex min-h-screen w-full items-center justify-center p-4">
    <div id="alerts" class="space-y-2">
        <div th:if="${param.error}"
             class="alert bg-red-100 text-red-700 border border-red-300 rounded-lg p-3 text-center">
            Usuario o contraseña incorrectos
        </div>
        <div th:if="${param.logout}"
             class="alert bg-blue-100 text-blue-700 border border-blue-300 rounded-lg p-3 text-center">
            Has cerrado sesión
        </div>
        <div th:if="${param.registered}"
             class="alert bg-green-100 text-green-700 border border-green-300 rounded-lg p-3 text-center">
            Registro exitoso. Inicia sesión
        </div>
    </div>
    <div class="w-full max-w-md space-y-8 rounded-xl bg-white p-6 shadow-sm dark:bg-background-dark/50 md:p-10">

        <div class="text-center">
            <h1 class="text-4xl font-black tracking-tighter text-text-light dark:text-text-dark">Bienvenido</h1>
            <p class="mt-2 text-base text-text-secondary-light dark:text-text-secondary-dark">Inicia sesión para
                continuar</p>
        </div>
        <form class="space-y-6" th:action="@{/login}" method="post">
            <div>
                <label class="block text-base font-medium text-text-light dark:text-text-dark"
                       for="username">Usuario</label>
                <div class="relative mt-2">
                    <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4">
                        <span class="material-symbols-outlined text-text-secondary-light dark:text-text-secondary-dark">person</span>
                    </div>
                    <input class="form-input block h-14 w-full rounded-lg border border-border-light bg-white p-4 pl-12 text-base text-text-light placeholder:text-text-secondary-light focus:border-primary focus:ring-primary dark:border-border-dark dark:bg-background-dark dark:text-text-dark dark:placeholder:text-text-secondary-dark"
                           id="username" name="username" placeholder="Ingresa tu usuario" type="text"/>
                </div>
            </div>
            <div>
                <label class="block text-base font-medium text-text-light dark:text-text-dark" for="password">Contraseña</label>
                <div class="relative mt-2">
                    <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4">
                        <span class="material-symbols-outlined text-text-secondary-light dark:text-text-secondary-dark">lock</span>
                    </div>
                    <input class="form-input block h-14 w-full rounded-lg border border-border-light bg-white p-4 pl-12 text-base text-text-light placeholder:text-text-secondary-light focus:border-primary focus:ring-primary dark:border-border-dark dark:bg-background-dark dark:text-text-dark dark:placeholder:text-text-secondary-dark"
                           id="password" name="password" placeholder="Ingresa tu contraseña" type="password"/>
                </div>
            </div>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div>
                <button class="flex h-12 w-full cursor-pointer items-center justify-center overflow-hidden rounded-lg bg-primary text-base font-bold text-white transition-colors hover:bg-primary/90 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary disabled:cursor-not-allowed disabled:opacity-50"
                        type="submit">
                    <span class="truncate">Iniciar Sesión</span>
                </button>
            </div>
        </form>
        <div class="text-center">
            <p class="text-sm text-text-secondary-light dark:text-text-secondary-dark">
                ¿No tienes una cuenta? <a class="font-medium text-primary underline hover:text-primary/90" th:href="@{/register}">Regístrate</a>
            </p>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const alerts = document.querySelectorAll('.alert');
        if (alerts.length > 0) {
            setTimeout(() => {
                alerts.forEach(alert => {
                    alert.classList.add('opacity-0', 'transition', 'duration-500');
                    setTimeout(() => alert.remove(), 500);
                });
            }, 3000);
        }
    });
</script>
</body>
</html>
